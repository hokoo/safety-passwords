services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: safety_passwords_integration
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - isolated

  cli:
    image: ${SP_TEST_CLI_IMAGE:?Select a supported test image}
    user: "0:0"
    working_dir: /var/www/html
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - site:/var/www/html
      - ${SP_TEST_ROOT:?Repository path required}/plugin-dir:/plugin-source:ro
      - ${SP_TEST_ROOT:?Repository path required}/dev/tests/fixtures:/test-fixtures:ro
      - ${SP_TEST_ROOT:?Repository path required}/dev/tests/php-memory.ini:/usr/local/etc/php/conf.d/zz-safety-passwords-test-memory.ini:ro
    networks:
      - isolated

  provision:
    image: ${SP_TEST_CLI_IMAGE:?Select a supported test image}
    user: "0:0"
    working_dir: /var/www/html
    volumes:
      - site:/var/www/html
      - ${SP_TEST_ROOT:?Repository path required}/dev/tests/php-memory.ini:/usr/local/etc/php/conf.d/zz-safety-passwords-test-memory.ini:ro
    networks:
      - download

networks:
  isolated:
    internal: true
    ipam:
      config:
        - subnet: ${SP_TEST_ISOLATED_SUBNET:?Select an unused subnet}
  download:
    ipam:
      config:
        - subnet: ${SP_TEST_DOWNLOAD_SUBNET:?Select an unused subnet}

volumes:
  db_data:
  site:
